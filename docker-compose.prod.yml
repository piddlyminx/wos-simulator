# Production compose file for a caller-configured public host.
#
# Intended to run alongside an existing Traefik v3 stack.
# The app image is built before the routed container is replaced; use
# scripts/wos-prod-deploy.sh for the safe build/restart flow.

name: wos-simulator-prod

services:
  app:
    build:
      context: .
      dockerfile: dashboard/web/Dockerfile
      target: prod
    image: ${WOS_SIM_IMAGE:-wos-simulator-dashboard:prod}
    user: "${WOS_SIM_UID:-1000}:${WOS_SIM_GID:-1000}"
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_PATH: /data/test_results/dashboard.sqlite
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in private configuration}
      SIMULATOR_PYTHON: /opt/sim-venv/bin/python
    volumes:
      - ./test_results:/data/test_results:rw
      - ./skill:/repo/skill:ro
      - type: bind
        source: ./simulator/testcase_results
        target: /repo/simulator/testcase_results
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.wos-sim.rule: Host(`${WOS_SIM_HOST:?Set WOS_SIM_HOST in the root .env or exported environment}`)
      traefik.http.routers.wos-sim.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.wos-sim.tls: "true"
      traefik.http.routers.wos-sim.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.wos-sim.loadbalancer.server.port: "3000"
    networks:
      - default
      - traefik

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Bootstrap only; the mounted HBA controls actual connection permissions.
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    # Host publishing and existing-volume selection belong in a private override.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dashboard/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./dashboard/postgres/init.sql:/docker-entrypoint-initdb.d/01-simulator.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wos_sim -d wos_sim"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default

volumes:
  postgres_data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
