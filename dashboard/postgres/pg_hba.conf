# Administration requires the postgres OS account inside the container.
local   all       postgres                         peer
local   wos_sim   wos_sim                          trust
local   all       all                              reject

# Publish host ports only on trusted interfaces in private deployment configuration.
# The only network-login role is the non-superuser simulator database owner.
host    wos_sim   wos_sim   0.0.0.0/0              trust
host    wos_sim   wos_sim   ::/0                   trust
host    all       all       0.0.0.0/0              reject
host    all       all       ::/0                   reject
